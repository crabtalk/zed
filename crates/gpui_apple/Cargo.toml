[package]
name = "bezel-gpui-apple"
version = "0.3.6+zed.d9ad6a"
description = "gpui_apple from zed-industries/zed, republished for the bezel gpui fork"
readme = "README.md"
repository = "https://github.com/crabtalk/zed"
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
name = "gpui_apple"
path = "src/gpui_apple.rs"

[features]
default = []
test-support = ["gpui/test-support"]
runtime_shaders = []

[dependencies]
gpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
anyhow.workspace = true
block.workspace = true
cocoa.workspace = true
collections.workspace = true
core-foundation.workspace = true
core-video.workspace = true
derive_more.workspace = true
etagere.workspace = true
foreign-types.workspace = true
image.workspace = true
log.workspace = true
metal.workspace = true
objc.workspace = true
parking_lot.workspace = true

[target.'cfg(target_os = "macos")'.build-dependencies]
cbindgen.workspace = true
gpui.workspace = true

