[package]
name = "bezel-gpui-wgpu"
version = "0.3.3+zed.d9ad6a"
description = "gpui_wgpu from zed-industries/zed, republished for the bezel gpui fork"
readme = "README.md"
repository = "https://github.com/crabtalk/zed"
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
name = "gpui_wgpu"
path = "src/gpui_wgpu.rs"

[features]
default = []
font-kit = ["dep:font-kit"]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
bytemuck = "1"
collections.workspace = true
cosmic-text = "0.19.0"
etagere.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
profiling.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
swash.workspace = true
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
gpui_util.workspace = true
wgpu.workspace = true

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { workspace = true, features = ["webgl"] }

[[bench]]
name = "layout_line"
harness = false
