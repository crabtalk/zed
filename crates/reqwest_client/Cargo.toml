[package]
name = "bezel-zed-reqwest-client"
version = "0.3.2+zed.d9ad6a"
description = "reqwest_client from zed-industries/zed, republished for the bezel gpui fork"
readme = "README.md"
repository = "https://github.com/crabtalk/zed"
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[features]
test-support = []

[lib]
name = "reqwest_client"
path = "src/reqwest_client.rs"
doctest = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
futures.workspace = true
http_client.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
regex.workspace = true
reqwest.workspace = true
gpui_util.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
http_client_tls.workspace = true
