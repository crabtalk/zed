[package]
name = "bezel-zed-ztracing"
version = "0.3.0+zed.bc538d"
description = "ztracing from zed-industries/zed, republished for the bezel gpui fork"
readme = "README.md"
repository = "https://github.com/crabtalk/zed"
edition.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
tracy = ["tracing-tracy", "tracy-client"]

[lib]
name = "ztracing"

[dependencies]
zlog.workspace = true
tracing.workspace = true

tracing-subscriber = "0.3.22"
tracing-tracy = { version = "0.11.4", optional = true, features = ["enable", "ondemand"] }
tracy-client = { version = "0.18.2", optional = true, features = ["enable", "ondemand"] }

ztracing_macro.workspace = true
